<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
      background: #161b22;
      padding: 40px 30px;
      border-radius: 16px;
      border: 1px solid #30363d;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }

    p {
      color: #8b949e;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #229ed9;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: .2s;
    }

    .btn:hover {
      background: #168ac0;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👨‍💻 Redsecure Developer</h1>
    <p>Need help or want to get in touch with the developer?</p>

    <a class="btn" href="https://t.me/redsecure" target="_blank" rel="noopener noreferrer">
      💬 Message Developer
    </a>
  </div>

</body>
</html>
